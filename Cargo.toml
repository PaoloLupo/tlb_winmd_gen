[package]
name = "tlb_winmd_gen"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
clap = {version = "4.6.1", features = ["derive"]}
crossterm = "0.29.0"
ratatui = "0.30.1"
thiserror = "2.0.18"
regex = "1.12.3"
windows = {version ="0.62.2", features = [
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant"
]}
windows-core = "0.62.2"
chmlib = {path = "crates/chmlib/chmlib"}
bitflags = "2.13.0"
tempfile = "3.27.0"

[[bin]]
name = "etabs_viewer"
path = "src/bin/etabs_viewer.rs"
